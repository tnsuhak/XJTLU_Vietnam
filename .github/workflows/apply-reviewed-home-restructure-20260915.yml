name: Apply reviewed XJTLU Vietnam homepage restructure

on:
  push:
    branches:
      - preview/home-restructure-reviewed-20260915
    paths:
      - '.github/workflows/apply-reviewed-home-restructure-20260915.yml'

permissions:
  contents: write

jobs:
  apply-reviewed-restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest-main preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/home-restructure-reviewed-20260915
          fetch-depth: 0

      - name: Apply Claude final restructure on top of latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TNS Site Manager'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin 1f4bc1a88ba2f40634006be09cb85fdc7a24d36b
          git cherry-pick -X theirs 1f4bc1a88ba2f40634006be09cb85fdc7a24d36b

      - name: Apply requested review fixes except Hero wording
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/tns-favicon-20260908
          git checkout origin/feature/tns-favicon-20260908 -- favicon.svg
          rm -f favicon-16.png favicon-32.png apple-touch-icon.png
          python scripts/remove_subpage_source_footers_20260909.py
          python - <<'PY'
          from pathlib import Path
          import re

          # Use the central TNS SVG favicon only; remove Claude's extra PNG/Apple icon links.
          for page in list(Path('.').glob('*.html')) + list(Path('news').glob('*.html')):
              s = page.read_text(encoding='utf-8')
              s = re.sub(r'<link rel="icon" type="image/png"[^>]*>\s*', '', s, flags=re.I)
              s = re.sub(r'<link rel="apple-touch-icon"[^>]*>\s*', '', s, flags=re.I)
              page.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the Hero wording exactly as approved by the user.
          hero = '<span class="line">Đại học Liverpool (Anh Quốc)</span>'
          assert hero in s, 'approved Hero wording changed unexpectedly'

          # Remove stale ranking emphasis from homepage search/social descriptions only.
          head, rest = s.split('</head>', 1)
          head = head.replace('XJTLU tại Tô Châu: xếp hạng, học phí, học bổng, điều kiện tuyển sinh 2027, ngành học, ký túc xá và bằng University of Liverpool.',
                              'XJTLU tại Tô Châu: học phí, học bổng, điều kiện tuyển sinh 2027, ngành học, ký túc xá và bằng University of Liverpool.')
          head = head.replace('XJTLU Việt Nam: xếp hạng, học phí, học bổng, tuyển sinh 2027, ngành học và bằng University of Liverpool dành cho sinh viên Việt Nam.',
                              'XJTLU Việt Nam: học phí, học bổng, tuyển sinh 2027, ngành học và bằng University of Liverpool dành cho sinh viên Việt Nam.')
          head = head.replace('XJTLU Việt Nam 2027: ranking, học phí, học bổng, tuyển sinh và bằng University of Liverpool.',
                              'XJTLU Việt Nam 2027: học phí, học bổng, tuyển sinh và bằng University of Liverpool.')
          p.write_text(head + '</head>' + rest, encoding='utf-8')

          # Validation.
          home = p.read_text(encoding='utf-8')
          assert hero in home
          assert '/og-image.png' in home
          assert '/favicon.svg' in home
          assert 'favicon-16.png' not in home and 'favicon-32.png' not in home and 'apple-touch-icon.png' not in home
          assert home.count('class="news-card') == 3, home.count('class="news-card')

          for page in sorted(Path('.').glob('*.html')):
              if page.name == 'index.html':
                  continue
              raw = page.read_text(encoding='utf-8')
              assert not re.search(r'class=["\'][^"\']*\b(?:sources|source|source-footer)\b', raw, re.I), page

          svg = Path('favicon.svg').read_text(encoding='utf-8')
          assert '#F4D717' in svg and '>tns<' in svg.lower()

          sm = Path('sitemap.xml').read_text(encoding='utf-8')
          assert sm.count('<url>') == 26, sm.count('<url>')
          assert 'xjtlu-ranking-2027.html' not in sm
          print('review validation passed')
          PY

      - name: Commit reviewed preview and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-reviewed-home-restructure-20260915.yml
          git add -A
          git commit -m 'fix(preview): align XJTLU Vietnam restructure with TNS policy'
          git push origin HEAD:preview/home-restructure-reviewed-20260915
