name: XJTLU Vietnam Preview Refinements

on:
  workflow_dispatch:
  push:
    branches:
      - preview/liverpool-china-seo
    paths:
      - "scripts/compact_mobile_hero_20260830.py"
      - "scripts/mobile_density_audit_20260830.py"
      - ".github/workflows/compact-mobile-hero-preview.yml"

permissions:
  contents: write

concurrency:
  group: xjtlu-vietnam-preview-refinements
  cancel-in-progress: false

jobs:
  refine-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/liverpool-china-seo
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "TNS Preview Bot"
          git config user.email "preview-bot@users.noreply.github.com"

      - name: Sync latest main safely
        run: |
          git fetch origin main
          git merge --no-edit -X ours origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply hero and route refinements
        run: python scripts/compact_mobile_hero_20260830.py

      - name: Apply mobile density audit
        run: python scripts/mobile_density_audit_20260830.py

      - name: Commit any post-merge refinements
        run: |
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "refactor(preview): compact mobile content density"
          fi
          git push origin HEAD:preview/liverpool-china-seo
