name: Compact Mobile Hero Preview

on:
  workflow_dispatch:
  push:
    branches:
      - preview/liverpool-china-seo
    paths:
      - "scripts/compact_mobile_hero_20260830.py"
      - ".github/workflows/compact-mobile-hero-preview.yml"

permissions:
  contents: write

jobs:
  compact-mobile-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/liverpool-china-seo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compact hero
        run: python scripts/compact_mobile_hero_20260830.py

      - name: Commit preview change
        run: |
          git config user.name "TNS Preview Bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hero changes to commit."
            exit 0
          fi
          git commit -m "feat(preview): shorten mobile hero"
          git pull --rebase origin preview/liverpool-china-seo
          git push origin HEAD:preview/liverpool-china-seo
