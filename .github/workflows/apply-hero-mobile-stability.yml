name: Apply Hero Mobile Stability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hero-stability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply mobile hero stability fix
        run: python seo/scripts/apply_hero_mobile_stability.py

      - name: Commit changes
        run: |
          git config user.name "TNS SEO Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "perf: stabilize mobile hero text rendering"
          git pull --rebase origin main
          git push origin HEAD:main
