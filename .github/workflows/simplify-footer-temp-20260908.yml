name: Simplify Homepage Footer (Temporary)

on:
  push:
    branches:
      - preview/homepage-news-before-contact-20260908-clean
    paths:
      - '.github/workflows/simplify-footer-temp-20260908.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/homepage-news-before-contact-20260908-clean
          fetch-depth: 0
      - name: Remove duplicate footer navigation groups
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_style = '''<style id="tns-footer-three-col-style">
          .foot-grid.tns-three-col{grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr))}
          @media(max-width:900px){.foot-grid.tns-three-col{grid-template-columns:1fr 1fr}}
          @media(max-width:620px){.foot-grid.tns-three-col{grid-template-columns:1fr}}
          </style>'''.replace('          ', '')
          new_style = '''<style id="tns-footer-three-col-style">
          .foot-grid.tns-three-col{grid-template-columns:minmax(0,1fr)}
          .foot-grid.tns-three-col .foot-brand p{max-width:760px}
          </style>'''.replace('          ', '')
          if old_style in text:
              text = text.replace(old_style, new_style, 1)
          else:
              raise SystemExit('Footer layout style block not found')

          content_group = '<div><h4>Nội dung</h4><ul><li><a href="/du-hoc-trung-quoc-2027.html">Du học Trung Quốc 2027</a></li><li><a href="/xjtlu-ranking-2027.html">XJTLU ranking 2027</a></li><li><a href="#information">Giới thiệu</a></li><li><a href="#major">Ngành học</a></li><li><a href="#tuition">Học phí &amp; học bổng</a></li><li><a href="#rooms">Đời sống sinh viên</a></li></ul></div>'
          admissions_group = '<div><h4>Tuyển sinh</h4><ul><li><a href="#admission">Điều kiện tuyển sinh</a></li><li><a href="#stories">Câu chuyện</a></li><li><a href="#news">Tin tức</a></li><li><a href="#reviews">Video</a></li><li><a href="#faq">Hỏi đáp</a></li><li><a href="#inquiry">Liên hệ</a></li></ul></div>'
          if content_group not in text or admissions_group not in text:
              raise SystemExit('Footer navigation groups not found')
          text = text.replace('\n      ' + content_group, '', 1)
          text = text.replace('\n      ' + admissions_group, '', 1)

          p.write_text(text, encoding='utf-8')
      - name: Commit simplified footer
        run: |
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(preview): simplify homepage footer"
          git pull --rebase origin preview/homepage-news-before-contact-20260908-clean
          git push origin HEAD:preview/homepage-news-before-contact-20260908-clean
