name: Apply Keyword SEO 2026-08-30

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_keyword_seo_20260830.py"
      - ".github/workflows/apply-keyword-seo-20260830.yml"

permissions:
  contents: write

concurrency:
  group: apply-keyword-seo-20260830
  cancel-in-progress: false

jobs:
  apply-keyword-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply keyword-demand SEO patch
        run: python scripts/apply_keyword_seo_20260830.py

      - name: Commit homepage changes
        run: |
          git config user.name "TNS SEO Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage SEO changes to commit."
            exit 0
          fi
          git commit -m "feat(seo): align homepage with Vietnam keyword demand"
          git pull --rebase origin main
          git push origin HEAD:main
