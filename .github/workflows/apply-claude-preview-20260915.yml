name: Apply Claude final preview bundle

on:
  push:
    branches:
      - preview/home-restructure-20260915-final
    paths:
      - '.github/workflows/apply-claude-preview-20260915.yml'

permissions:
  contents: write

jobs:
  apply-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/home-restructure-20260915-final
          fetch-depth: 0

      - name: Reassemble and verify Claude bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .tns-zip/part*.b64 > /tmp/xjtlu-preview.b64
          base64 --decode /tmp/xjtlu-preview.b64 > /tmp/xjtlu-preview.zip
          echo 'a44f20228141e3ef76e6cf3f116c65a2bfd77c6b8e652ee3aa0ef2f6682f74c2  /tmp/xjtlu-preview.zip' | sha256sum -c -
          unzip -t /tmp/xjtlu-preview.zip

      - name: Apply final files and remove staging data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xjtlu-preview
          mkdir -p /tmp/xjtlu-preview
          unzip -q /tmp/xjtlu-preview.zip -d /tmp/xjtlu-preview
          cp -a /tmp/xjtlu-preview/. ./
          rm -rf .tns-zip .tns-bundle .tns-transfer .tns-full .tns-bundle64
          rm -f .github/workflows/apply-claude-preview-20260915.yml

      - name: Commit final preview files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TNS Preview Bot'
          git config user.email 'preview-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(preview): apply Claude Vietnam homepage restructure'
          git push origin HEAD:preview/home-restructure-20260915-final
