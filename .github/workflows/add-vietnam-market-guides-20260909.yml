name: Build Vietnam-market XJTLU guides

on:
  push:
    branches:
      - preview/home-hero-copy-20260908
    paths:
      - 'scripts/add_vietnam_market_guides_20260909.py'
      - 'scripts/polish_vietnam_market_guides_20260909.py'
      - '.github/workflows/add-vietnam-market-guides-20260909.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vietnam-market-guides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and polish pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/add_vietnam_market_guides_20260909.py')
          s=p.read_text(encoding='utf-8')
          needle="pages={\n'xjtlu-to-chau-thuong-hai-viet-nam.html':page("
          if needle in s:
              a=s.index(needle)
              b=s.index('# rebuild first page',a)
              s=s[:a]+"pages={}\n"+s[b:]
              p.write_text(s,encoding='utf-8')
          PY
          python scripts/add_vietnam_market_guides_20260909.py
          python scripts/polish_vietnam_market_guides_20260909.py

      - name: Validate new pages and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          new=[
            'xjtlu-to-chau-thuong-hai-viet-nam.html',
            'xjtlu-chi-phi-sinh-hoat-2027.html',
            'xjtlu-ky-tuc-xa-sip-taicang.html'
          ]
          for f in new:
              p=Path(f); assert p.exists(),f
              s=p.read_text(encoding='utf-8')
              assert s.count('<h1>')==1,f
              assert 'rel="canonical"' in s,f
              assert 'TNS_SUBPAGE_CONTACT_START' in s,f
              assert 'class="sources"' not in s,f
              assert '<meta name="robots" content="index,follow' in s,f
              assert 'VISIBLE-FAQ-20260909' in s,f
              assert '<section class="section faq">' in s,f
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for f in new: assert f in sm,f
          home=Path('index.html').read_text(encoding='utf-8')
          for f in new: assert f in home,f
          prog=Path('xjtlu-nganh-hoc-nghe-nghiep.html').read_text(encoding='utf-8')
          life=Path('xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html').read_text(encoding='utf-8')
          assert 'VIETNAM-SUZHOU-CONTEXT-20260909' in prog
          assert 'PRACTICAL-LIFE-LINKS-20260909' in life
          for f in new:
              s=Path(f).read_text(encoding='utf-8')
              for href in re.findall(r'href="(/[^"]+\.html)(?:#[^"]*)?"',s):
                  target=href.lstrip('/')
                  assert Path(target).exists(),(f,target)
          # Critical factual values used in the new guides.
          assert '204,75 tỷ RMB' in Path(new[0]).read_text(encoding='utf-8')
          cost=Path(new[1]).read_text(encoding='utf-8')
          assert all(x in cost for x in ['3.700 RMB','6.450 RMB','9.600 RMB'])
          acc=Path(new[2]).read_text(encoding='utf-8')
          assert all(x in acc for x in ['57 RMB/ngày','6.000 RMB','14.000 RMB'])
          print('validation passed:',len(new),'new guides')
          PY

      - name: Commit generated content
        run: |
          git config user.name 'TNS Site Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/add_vietnam_market_guides_20260909.py \
            scripts/polish_vietnam_market_guides_20260909.py \
            index.html sitemap.xml \
            xjtlu-nganh-hoc-nghe-nghiep.html \
            xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html \
            xjtlu-to-chau-thuong-hai-viet-nam.html \
            xjtlu-chi-phi-sinh-hoat-2027.html \
            xjtlu-ky-tuc-xa-sip-taicang.html \
            '*.html' 'news/*.html'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Polish Vietnam-market Suzhou, cost and accommodation guides'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
