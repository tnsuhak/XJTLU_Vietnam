name: Apply Homepage SEO Patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_homepage_seo.py'
      - '.github/workflows/apply-homepage-seo.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply SEO patch
        run: python scripts/apply_homepage_seo.py

      - name: Commit SEO changes
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage already up to date"
            exit 0
          fi
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize XJTLU Vietnam homepage SEO"
          git push
