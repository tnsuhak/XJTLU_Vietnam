name: Ensure Homepage SEO Structure

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'news/700-sinh-vien-indonesia-xjtlu-dong-nam-a.html'
      - 'scripts/ensure_homepage_seo_links.py'
      - 'scripts/lighten_homepage_student_life_20260905.py'
      - 'scripts/lighten_homepage_stories_20260905.py'
      - '.github/workflows/ensure-homepage-seo-links.yml'

permissions:
  contents: write

concurrency:
  group: ensure-homepage-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize homepage and related SEO structure
        run: python scripts/ensure_homepage_seo_links.py

      - name: Keep homepage light and route details to subpages
        run: python scripts/lighten_homepage_student_life_20260905.py

      - name: Compact stories and mobile news
        run: python scripts/lighten_homepage_stories_20260905.py

      - name: Commit normalized pages
        run: |
          FILES=(
            index.html
            sitemap.xml
            news/700-sinh-vien-indonesia-xjtlu-dong-nam-a.html
          )
          if [ -z "$(git status --porcelain -- "${FILES[@]}")" ]; then
            echo "SEO/UX structure already current"
            exit 0
          fi
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Refine light homepage, stories and student-life routing"
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
