name: Ensure Homepage SEO Structure

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'scripts/ensure_homepage_seo_links.py'
      - '.github/workflows/ensure-homepage-seo-links.yml'

permissions:
  contents: write

concurrency:
  group: ensure-homepage-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize homepage SEO structure
        run: python scripts/ensure_homepage_seo_links.py

      - name: Commit normalized homepage
        run: |
          if [ -z "$(git status --porcelain -- index.html)" ]; then
            echo "Homepage SEO structure already current"
            exit 0
          fi
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize homepage SEO structure"
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
