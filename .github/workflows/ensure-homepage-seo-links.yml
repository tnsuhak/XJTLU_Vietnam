name: Ensure Homepage SEO Structure

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ensure_homepage_seo_links.py'
      - '.github/workflows/ensure-homepage-seo-links.yml'

permissions:
  contents: write

jobs:
  ensure-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply homepage SEO structure
        run: python scripts/ensure_homepage_seo_links.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- index.html)" ]; then
            echo "No homepage SEO changes"
            exit 0
          fi
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add homepage SEO guides and structured data"
          git push
