name: Apply Sports Video Cleanup (Temporary)

on:
  push:
    branches:
      - preview/homepage-news-before-contact-20260908-clean
    paths:
      - '.github/workflows/apply-sports-videos-temp-20260908.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/homepage-news-before-contact-20260908-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply sports video cleanup
        run: python scripts/replace_sports_videos_20260906.py
      - name: Validate page
        run: |
          grep -q 'drOy9rzNmlE' xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html
          grep -q 'T8g0zoI9rO4' xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html
          ! grep -q 'XciLskXWwIU' xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html
          ! grep -q 'nVirGEvdcT8' xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html
          ! grep -q 'Mở trên YouTube' xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html
      - name: Commit generated page
        run: |
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add xjtlu-doi-song-sinh-vien-the-thao-cau-lac-bo.html
          git commit -m "fix(preview): remove duplicate sports video and YouTube links"
          git pull --rebase origin preview/homepage-news-before-contact-20260908-clean
          git push origin HEAD:preview/homepage-news-before-contact-20260908-clean
