name: Fix News Menu Click Target

on:
  push:
    branches:
      - preview/korea-style-subpages-20260905
    paths:
      - '.github/workflows/fix-news-menu-click-20260906.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/korea-style-subpages-20260905
          fetch-depth: 0
      - name: Expand news menu click target
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/unify_site_navigation_20260905.py')
          text = p.read_text(encoding='utf-8')
          old = '<section class="tns-site-menu-group"><h3><a href="/news/">Tin tức XJTLU <small>Xem tin →</small></a></h3><p>Tin chính thức đáng chú ý được chọn lọc và tóm tắt bằng tiếng Việt.</p></section>'
          new = '<section class="tns-site-menu-group"><h3><a href="/news/">Tin tức XJTLU <small>Xem tin →</small></a></h3><a href="/news/">Tin chính thức đáng chú ý được chọn lọc và tóm tắt bằng tiếng Việt →</a></section>'
          if old not in text:
              raise SystemExit('Expected news menu block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Regenerate site navigation
        run: python scripts/unify_site_navigation_20260905.py
      - name: Commit fix
        run: |
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/unify_site_navigation_20260905.py index.html *.html news/*.html
          git commit -m "fix(preview): make news menu row clickable"
          git pull --rebase origin preview/korea-style-subpages-20260905
          git push origin HEAD:preview/korea-style-subpages-20260905
