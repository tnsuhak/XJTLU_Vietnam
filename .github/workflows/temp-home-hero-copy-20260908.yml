name: Temporary Homepage Hero Copy
on:
  push:
    branches: [preview/home-hero-copy-20260908]
    paths:
      - '.github/workflows/temp-home-hero-copy-20260908.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch homepage hero only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<span class="line accent">Học bằng tiếng Anh</span>'
          new='<span class="line accent">100% học bằng tiếng Anh</span>'
          if old not in s and new not in s:
              raise SystemExit('Expected homepage hero line not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert '<span class="line">Đại học Liverpool (Anh Quốc)</span>' in s
          assert '<span class="line accent">100% học bằng tiếng Anh</span>' in s
          assert '<span class="line">Tô Châu, Trung Quốc</span>' in s
          PY
      - name: Commit only homepage change and remove temporary workflow
        run: |
          git config user.name 'TNS Site Manager'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temp-home-hero-copy-20260908.yml
          git add index.html
          git commit -m 'Update Vietnamese homepage hero copy'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
