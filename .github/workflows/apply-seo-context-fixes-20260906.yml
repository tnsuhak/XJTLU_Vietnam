name: Apply SEO Context Fixes

on:
  push:
    branches:
      - preview/korea-style-subpages-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/korea-style-subpages-20260905
          fetch-depth: 0
      - name: Apply approved SEO and copy refinements
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  print(f'SKIP {path}: pattern already absent')
                  return False
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'UPDATED {path}')
              return True

          # Homepage: lead with the natural Vietnamese brand/query family.
          replace('index.html',
              "<title>Xi'an Jiaotong-Liverpool University (XJTLU) | Vietnam 2027</title>",
              "<title>XJTLU Việt Nam 2027 | Học phí, học bổng & tuyển sinh</title>")
          replace('index.html',
              "<meta property=\"og:title\" content=\"Xi'an Jiaotong-Liverpool University (XJTLU) | Vietnam 2027\">",
              "<meta property=\"og:title\" content=\"XJTLU Việt Nam 2027 | Học phí, học bổng & tuyển sinh\">")
          replace('index.html',
              "<meta property=\"og:description\" content=\"XJTLU Vietnam: xếp hạng, học phí, học bổng, tuyển sinh 2027, ngành học và bằng University of Liverpool dành cho sinh viên Việt Nam.\">",
              "<meta property=\"og:description\" content=\"XJTLU Việt Nam: xếp hạng, học phí, học bổng, tuyển sinh 2027, ngành học và bằng University of Liverpool dành cho sinh viên Việt Nam.\">")
          replace('index.html',
              "<meta name=\"twitter:title\" content=\"Xi'an Jiaotong-Liverpool University (XJTLU) | Vietnam 2027\">",
              "<meta name=\"twitter:title\" content=\"XJTLU Việt Nam 2027 | Học phí, học bổng & tuyển sinh\">")
          replace('index.html',
              "<meta name=\"twitter:description\" content=\"XJTLU Vietnam 2027: ranking, học phí, học bổng, tuyển sinh và bằng University of Liverpool.\">",
              "<meta name=\"twitter:description\" content=\"XJTLU Việt Nam 2027: ranking, học phí, học bổng, tuyển sinh và bằng University of Liverpool.\">")

          # Ranking: Vietnamese first, keep English 'Ranking' as a natural secondary query.
          replace('xjtlu-ranking-2027.html',
              '<title>XJTLU Ranking 2027: QS, THE & ARWU | XJTLU Vietnam</title>',
              '<title>Xếp hạng XJTLU 2027 (Ranking) | QS, THE & ARWU</title>')
          replace('xjtlu-ranking-2027.html',
              '<meta property="og:title" content="XJTLU Ranking 2027: QS, THE & ARWU">',
              '<meta property="og:title" content="Xếp hạng XJTLU 2027 (Ranking): QS, THE & ARWU">')
          replace('xjtlu-ranking-2027.html',
              '"headline":"XJTLU Ranking 2027: QS, THE & ARWU"',
              '"headline":"Xếp hạng XJTLU 2027 (Ranking): QS, THE & ARWU"')
          replace('xjtlu-ranking-2027.html',
              '"dateModified":"2026-08-30"',
              '"dateModified":"2026-09-06"')

          # 2+2 page: local-language site naming consistency.
          replace('xjtlu-2plus2-liverpool.html',
              '<title>XJTLU 2+2 & bằng University of Liverpool | XJTLU Vietnam</title>',
              '<title>XJTLU 2+2 & bằng University of Liverpool | XJTLU Việt Nam</title>')
          replace('xjtlu-2plus2-liverpool.html',
              '"dateModified":"2026-09-05"',
              '"dateModified":"2026-09-06"')

          # Liverpool–Vietnam: keep the caveat, but do not make a negative disclaimer the opening message.
          replace('university-of-liverpool-vietnam.html',
              '<title>University of Liverpool & Việt Nam: giáo dục, AI, y tế | XJTLU Vietnam</title>',
              '<title>University of Liverpool & Việt Nam: giáo dục, AI, y tế | XJTLU Việt Nam</title>')
          replace('university-of-liverpool-vietnam.html',
              '<small>Điểm cần hiểu trước</small><h2>Đây không phải là “hợp tác trực tiếp XJTLU × Việt Nam”</h2><p>Các mốc dưới đây cho thấy kết nối giữa <b>Việt Nam, Liverpool và University of Liverpool</b> đang mở rộng từ giáo dục, y tế và khoa học-công nghệ sang đổi mới và văn hóa. Đây là bối cảnh đáng chú ý với người tìm hiểu XJTLU vì XJTLU có quan hệ học thuật và bằng cấp sâu với University of Liverpool.</p>',
              '<small>Vì sao liên quan đến XJTLU?</small><h2>Vì sao mạng lưới Liverpool tại Việt Nam đáng chú ý với sinh viên XJTLU?</h2><p>XJTLU được <b>University of Liverpool</b> và Xi\'an Jiaotong University đồng sáng lập, đồng thời có quan hệ học thuật, bằng cấp và lộ trình 2+2 với University of Liverpool. Vì vậy các kết nối ngày càng mở rộng giữa Liverpool, University of Liverpool và Việt Nam là bối cảnh đáng chú ý với học sinh Việt Nam đang tìm hiểu XJTLU. Các mốc dưới đây không phải thỏa thuận tuyển sinh trực tiếp giữa XJTLU và Việt Nam.</p>')
          replace('university-of-liverpool-vietnam.html',
              '"dateModified":"2026-09-05"',
              '"dateModified":"2026-09-06"')
          replace('university-of-liverpool-vietnam.html',
              '<div class="updated">Cập nhật: 05/09/2026</div>',
              '<div class="updated">Cập nhật: 06/09/2026</div>')

          # Sitemap: update only URLs whose page content changed in this batch.
          s = Path('sitemap.xml')
          text = s.read_text(encoding='utf-8')
          targets = [
              'https://xjtlu-vietnam.netlify.app/',
              'https://xjtlu-vietnam.netlify.app/xjtlu-2plus2-liverpool.html',
              'https://xjtlu-vietnam.netlify.app/xjtlu-ranking-2027.html',
              'https://xjtlu-vietnam.netlify.app/university-of-liverpool-vietnam.html',
          ]
          for url in targets:
              import re
              pattern = rf'(<loc>{re.escape(url)}</loc>\s*<lastmod>)[0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}(</lastmod>)'
              text, n = re.subn(pattern, rf'\g<1>2026-09-06\2', text)
              print(f'SITEMAP {url}: {n} updated')
          s.write_text(text, encoding='utf-8')
      - name: Commit changes to the same preview branch
        run: |
          if git diff --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add index.html xjtlu-ranking-2027.html xjtlu-2plus2-liverpool.html university-of-liverpool-vietnam.html sitemap.xml
          git commit -m "fix(preview): refine Vietnamese SEO titles and Liverpool context"
          git push origin HEAD:preview/korea-style-subpages-20260905
