name: Google Keyword Research

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "seo-keywords/raw/*.csv"
      - "seo/scripts/process_keyword_planner.py"
      - "seo-keywords/config.json"

permissions:
  contents: write

concurrency:
  group: google-keyword-research
  cancel-in-progress: false

jobs:
  process-keyword-planner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process latest Keyword Planner CSV
        run: python seo/scripts/process_keyword_planner.py

      - name: Commit normalized keyword data
        run: |
          git config user.name "TNS SEO Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add seo-keywords/latest-keywords.csv seo-keywords/keyword-strategy.md
          if git diff --cached --quiet; then
            echo "No keyword data changes to commit."
            exit 0
          fi
          git commit -m "chore(seo): refresh Google keyword research data"
          git pull --rebase origin main
          git push origin HEAD:main
